<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ff9ecf, #c58aff, #8e7dff);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* =========================
           START SCREEN
        ========================== */

        #startScreen {
            text-align: center;
            transition: 1s ease;
            position: relative;
            z-index: 10;
        }

        .intro {
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: bold;
            text-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .gift {
            font-size: 120px;
            cursor: pointer;
            display: inline-block;
            animation: giftBounce 1.5s infinite;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.2));
            transition: 0.3s;
        }

        .gift:hover {
            transform: scale(1.15);
        }

        .clickText {
            margin-top: 20px;
            font-size: 18px;
            opacity: 0.9;
            animation: pulse 1.5s infinite;
        }

        @keyframes giftBounce {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(3deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================
           FLOATING BIRTHDAY PHOTOS
           
           IMPORTANT:
           Put your photo in the SAME
           folder as this HTML file.
           
           Example:
           birthday.html
           celebrant.jpg
           
           Change "celebrant.jpg"
           to your actual photo filename.
        ========================== */

        .photo {
            position: absolute;
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            opacity: 0.85;
            pointer-events: none;
            animation: photoFloat linear infinite;
            z-index: 1;
        }

        .photo1 {
            left: 5%;
            animation-duration: 12s;
            animation-delay: 0s;
        }

        .photo2 {
            left: 25%;
            width: 90px;
            height: 90px;
            animation-duration: 15s;
            animation-delay: 3s;
        }

        .photo3 {
            left: 50%;
            width: 120px;
            height: 120px;
            animation-duration: 13s;
            animation-delay: 6s;
        }

        .photo4 {
            left: 72%;
            width: 95px;
            height: 95px;
            animation-duration: 16s;
            animation-delay: 2s;
        }

        .photo5 {
            left: 88%;
            width: 115px;
            height: 115px;
            animation-duration: 14s;
            animation-delay: 5s;
        }

        @keyframes photoFloat {

            0% {
                transform: translateY(110vh) rotate(-15deg);
            }

            50% {
                transform: translateY(50vh) rotate(15deg);
            }

            100% {
                transform: translateY(-150px) rotate(-15deg);
            }

        }

        /* =========================
           BIRTHDAY SCREEN
        ========================== */

        #birthdayScreen {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 5;
        }

        .birthdayTitle {
            position: absolute;
            top: 8%;
            text-align: center;
            font-size: clamp(38px, 7vw, 75px);
            font-weight: 900;
            opacity: 0;
            transform: scale(0.5);
            text-shadow:
                0 5px 10px rgba(0,0,0,0.2),
                0 0 20px rgba(255,255,255,0.5);
            z-index: 20;
        }

        .birthdayTitle.show {
            animation: titleAppear 1.5s forwards;
        }

        @keyframes titleAppear {

            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }

        }

        /* =========================
           CAKE
        ========================== */

        .cakeArea {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 15;
        }

        .cake {
            position: relative;
            width: 300px;
            height: 260px;
        }

        .cakeLayer {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 15px;
            opacity: 0;
        }

        /* Bottom Layer */

        .bottomLayer {
            width: 300px;
            height: 75px;
            bottom: 0;
            background: #ff75a8;
            box-shadow:
                inset 0 -12px rgba(180, 50, 100, 0.15),
                0 10px 20px rgba(0,0,0,0.2);
        }

        /* Middle Layer */

        .middleLayer {
            width: 240px;
            height: 65px;
            bottom: 70px;
            background: #ffb1d0;
            box-shadow:
                inset 0 -10px rgba(180, 70, 120, 0.12),
                0 8px 15px rgba(0,0,0,0.15);
        }

        /* Top Layer */

        .topLayer {
            width: 180px;
            height: 55px;
            bottom: 130px;
            background: #ffd1e4;
            box-shadow:
                inset 0 -8px rgba(180, 70, 120, 0.1),
                0 7px 12px rgba(0,0,0,0.15);
        }

        /* Icing */

        .icing {
            position: absolute;
            width: 100%;
            height: 18px;
            top: 0;
            left: 0;
            background: white;
            border-radius: 15px 15px 10px 10px;
        }

        /* Sprinkles */

        .sprinkle {
            position: absolute;
            width: 8px;
            height: 15px;
            background: white;
            border-radius: 10px;
            transform: rotate(25deg);
        }

        .s1 {
            left: 20%;
            top: 30%;
        }

        .s2 {
            left: 40%;
            top: 45%;
            transform: rotate(-20deg);
        }

        .s3 {
            left: 65%;
            top: 25%;
            transform: rotate(40deg);
        }

        .s4 {
            left: 80%;
            top: 50%;
            transform: rotate(-30deg);
        }

        /* =========================
           CANDLE
        ========================== */

        .candle {
            position: absolute;
            width: 22px;
            height: 65px;
            background: linear-gradient(to right, #9e7cff, #d8c8ff);
            left: 50%;
            transform: translateX(-50%);
            bottom: 180px;
            border-radius: 6px;
            opacity: 0;
        }

        .flame {
            position: absolute;
            width: 25px;
            height: 35px;
            background: #fff36b;
            border-radius: 50%;
            left: 50%;
            top: -30px;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #fff36b;
            animation: flame 0.7s infinite alternate;
        }

        @keyframes flame {

            from {
                transform: translateX(-50%) scale(1);
            }

            to {
                transform: translateX(-50%) scale(1.15);
            }

        }

        /* =========================
           CAKE FALL ANIMATIONS
        ========================== */

        .dropBottom {
            animation: dropBottom 1.2s cubic-bezier(.17,.67,.35,1.4) forwards;
        }

        .dropMiddle {
            animation: dropMiddle 1.2s 0.7s cubic-bezier(.17,.67,.35,1.4) forwards;
        }

        .dropTop {
            animation: dropTop 1.2s 1.4s cubic-bezier(.17,.67,.35,1.4) forwards;
        }

        .dropCandle {
            animation: dropCandle 1s 2.1s cubic-bezier(.17,.67,.35,1.4) forwards;
        }

        @keyframes dropBottom {

            0% {
                opacity: 1;
                transform: translate(-50%, -600px) rotate(-8deg);
            }

            75% {
                transform: translate(-50%, 20px) rotate(3deg);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, 0) rotate(0deg);
            }

        }

        @keyframes dropMiddle {

            0% {
                opacity: 1;
                transform: translate(-50%, -700px) rotate(10deg);
            }

            75% {
                transform: translate(-50%, -50px) rotate(-3deg);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, 0) rotate(0deg);
            }

        }

        @keyframes dropTop {

            0% {
                opacity: 1;
                transform: translate(-50%, -800px) rotate(-12deg);
            }

            75% {
                transform: translate(-50%, -40px) rotate(4deg);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, 0) rotate(0deg);
            }

        }

        @keyframes dropCandle {

            0% {
                opacity: 1;
                transform: translate(-50%, -900px) rotate(15deg);
            }

            75% {
                transform: translate(-50%, -20px) rotate(-3deg);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, 0) rotate(0deg);
            }

        }

        /* =========================
           CONFETTI
        ========================== */

        .confetti {
            position: absolute;
            width: 10px;
            height: 18px;
            top: -30px;
            animation: confettiFall linear forwards;
            z-index: 30;
        }

        @keyframes confettiFall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }

        }

        /* =========================
           FLOATING HEARTS
        ========================== */

        .heart {
            position: absolute;
            bottom: -30px;
            font-size: 25px;
            animation: heartFloat 5s linear forwards;
            opacity: 0.8;
            z-index: 25;
        }

        @keyframes heartFloat {

            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh) scale(1.5) rotate(20deg);
                opacity: 0;
            }

        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            position: absolute;
            bottom: 6%;
            font-size: 18px;
            opacity: 0;
            text-align: center;
            z-index: 20;
        }

        .message.show {
            animation: messageAppear 1.5s 3.5s forwards;
        }

        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .gift {
                font-size: 90px;
            }

            .cakeArea {
                transform: scale(0.8);
            }

            .birthdayTitle {
                top: 10%;
            }

            .message {
                padding: 0 20px;
            }

            .photo {
                opacity: 0.65;
            }

        }

    </style>
</head>


<body>

    <!-- ==================================================
         🎀 BIRTHDAY CELEBRANT PHOTOS
         
         IMPORTANT:
         PUT YOUR PHOTO IN THE SAME FOLDER AS THIS HTML.

         Example:

         Birthday Website/
         ├── birthday.html
         └── celebrant.jpg

         If your photo is called "ysabirthday.jpg",
         change every "celebrant.jpg" below to:
         
         src="ysabirthday.jpg"
    =================================================== -->

    <img src="celebrant1.jpeg" class="photo photo1">

    <img src="celebrant2.jpeg" class="photo photo2">

    <img src="celebrant3.jpeg" class="photo photo3">

    <img src="celebrant.jpeg" class="photo photo4">

    <img src="celebrant.jpeg" class="photo photo5">


    <!-- ==================================================
         🎁 START SCREEN
    =================================================== -->

    <div id="startScreen">

        <div class="intro">
             NARAGSAK A PANAGKASANGAY, CARR!!
        </div>

        <div class="gift" onclick="openGift()">
            🎁
        </div>

        <div class="clickText">
            Toploka ni
        </div>

    </div>


    <!-- ==================================================
         🎂 BIRTHDAY SCREEN
    =================================================== -->

    <div id="birthdayScreen">

        <h1 class="birthdayTitle">
            🎉HAPII BORTDI NIGHER!🎂
        </h1>


        <div class="cakeArea">

            <div class="cake">

                <!-- =========================
                     BOTTOM CAKE LAYER
                ========================== -->

                <div class="cakeLayer bottomLayer" id="bottomLayer">

                    <div class="icing"></div>

                    <div class="sprinkle s1"></div>
                    <div class="sprinkle s2"></div>
                    <div class="sprinkle s3"></div>
                    <div class="sprinkle s4"></div>

                </div>


                <!-- =========================
                     MIDDLE CAKE LAYER
                ========================== -->

                <div class="cakeLayer middleLayer" id="middleLayer">

                    <div class="icing"></div>

                    <div class="sprinkle s1"></div>
                    <div class="sprinkle s2"></div>
                    <div class="sprinkle s3"></div>
                    <div class="sprinkle s4"></div>

                </div>


                <!-- =========================
                     TOP CAKE LAYER
                ========================== -->

                <div class="cakeLayer topLayer" id="topLayer">

                    <div class="icing"></div>

                    <div class="sprinkle s1"></div>
                    <div class="sprinkle s2"></div>
                    <div class="sprinkle s3"></div>
                    <div class="sprinkle s4"></div>

                </div>


                <!-- =========================
                     CANDLE
                ========================== -->

                <div class="candle" id="candle">

                    <div class="flame"></div>

                </div>

            </div>

        </div>


        <!-- =========================
             BIRTHDAY MESSAGE
        ========================== -->

        <div class="message" id="message">

            Mabuhay ka hangat gusto mo!        </div>

    </div>


    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <script>

        function openGift() {

            /* Hide the gift screen */

            const startScreen =
                document.getElementById("startScreen");

            startScreen.style.opacity = "0";
            startScreen.style.transform = "scale(0.5)";


            setTimeout(() => {

                startScreen.style.display = "none";


                /* Show birthday screen */

                const birthdayScreen =
                    document.getElementById("birthdayScreen");

                birthdayScreen.style.display = "flex";


                /* =========================
                   START CAKE ANIMATION
                ========================== */

                document
                    .getElementById("bottomLayer")
                    .classList.add("dropBottom");

                document
                    .getElementById("middleLayer")
                    .classList.add("dropMiddle");

                document
                    .getElementById("topLayer")
                    .classList.add("dropTop");

                document
                    .getElementById("candle")
                    .classList.add("dropCandle");


                /* =========================
                   SHOW HAPPY BIRTHDAY
                ========================== */

                setTimeout(() => {

                    document
                        .querySelector(".birthdayTitle")
                        .classList.add("show");

                }, 2700);


                /* =========================
                   SHOW MESSAGE
                ========================== */

                document
                    .getElementById("message")
                    .classList.add("show");


                /* =========================
                   CONFETTI
                ========================== */

                createConfetti();


                /* =========================
                   FLOATING HEARTS
                ========================== */

                createHearts();

            }, 800);

        }


        /* ==================================================
           CONFETTI FUNCTION
        =================================================== */

        function createConfetti() {

            const pieces = 100;


            for (let i = 0; i < pieces; i++) {

                const confetti =
                    document.createElement("div");


                confetti.classList.add("confetti");


                confetti.style.left =
                    Math.random() * 100 + "vw";


                confetti.style.animationDuration =
                    (Math.random() * 3 + 3) + "s";


                confetti.style.animationDelay =
                    Math.random() * 2 + "s";


                confetti.style.transform =
                    "rotate(" +
                    Math.random() * 360 +
                    "deg)";


                const shapes = [
                    "🎉",
                    "✨",
                    "⭐",
                    "💖",
                    "🎊"
                ];


                confetti.innerHTML =
                    shapes[
                        Math.floor(
                            Math.random() * shapes.length
                        )
                    ];


                document.body.appendChild(confetti);


                setTimeout(() => {

                    confetti.remove();

                }, 7000);

            }

        }


        /* ==================================================
           FLOATING HEART FUNCTION
        =================================================== */

        function createHearts() {

            setInterval(() => {

                const heart =
                    document.createElement("div");


                heart.classList.add("heart");


                heart.innerHTML =
                    Math.random() > 0.5
                    ? "🌟"
                    : "⭐";


                heart.style.left =
                    Math.random() * 100 + "vw";


                heart.style.animationDuration =
                    (Math.random() * 3 + 4) + "s";


                document.body.appendChild(heart);


                setTimeout(() => {

                    heart.remove();

                }, 7000);

            }, 500);

        }

    </script>

</body>
</html>
